name: Build and deploy (EKS)

# Flow: main → prod | dev → dev | test → test
# Jobs: Build → Deliver → Deploy → Verify
on:
  push:
    branches:
      - main
      - dev
      - test
    paths:
      - 'app.py'
      - 'Frontend/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'helm/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - prod
          - dev
          - test
        default: prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: e3-diagnostic-software-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '222634361936' }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER || 'e3-eks' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'e3-diagnostic-software' }}
  IAM_ROLE_ARN: ${{ vars.IAM_ROLE_ARN || 'arn:aws:iam::222634361936:role/GitHubActions-ECR-EKS' }}
  HELM_RELEASE: ${{ vars.HELM_RELEASE || 'e3-diagnostic-software' }}
  IMAGE_ARTIFACT: e3-diagnostic-software-image.tar

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      namespace: ${{ steps.meta.outputs.namespace }}
      values: ${{ steps.meta.outputs.values }}
      tag: ${{ steps.meta.outputs.tag }}
      env_name: ${{ steps.meta.outputs.env_name }}
      image: ${{ steps.meta.outputs.image }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deployment values
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [[ -n "${{ github.event.inputs.environment }}" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ENV_NAME="prod"
          elif [[ "${GITHUB_REF}" == "refs/heads/test" ]]; then
            ENV_NAME="test"
          else
            ENV_NAME="dev"
          fi

          if [[ "$ENV_NAME" == "prod" ]]; then
            NAMESPACE="prod"
            VALUES="helm/e3-diagnostic-software/values-prod.yaml"
            TAG="prod-${SHORT_SHA}"
          elif [[ "$ENV_NAME" == "test" ]]; then
            NAMESPACE="test"
            VALUES="helm/e3-diagnostic-software/values-test.yaml"
            TAG="test-${SHORT_SHA}"
          else
            NAMESPACE="dev"
            VALUES="helm/e3-diagnostic-software/values-dev.yaml"
            TAG="dev-${SHORT_SHA}"
          fi

          IMAGE_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE="${IMAGE_REPO}:${TAG}"

          {
            echo "namespace=$NAMESPACE"
            echo "values=$VALUES"
            echo "tag=$TAG"
            echo "env_name=$ENV_NAME"
            echo "image=$IMAGE"
            echo "image_repo=$IMAGE_REPO"
          } >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo " Environment : $ENV_NAME"
          echo " Namespace   : $NAMESPACE"
          echo " Image tag   : $TAG"
          echo " Values file : $VALUES"
          echo " ECR repo    : $ECR_REPOSITORY"
          echo "========================================"

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build --pull -t "$IMAGE" .
          docker save "$IMAGE" -o "$IMAGE_ARTIFACT"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_ARTIFACT }}
          retention-days: 1
          if-no-files-found: error

  Deliver:
    needs: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.Build.outputs.env_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$ECR_REPOSITORY" \
                 --region "$AWS_REGION" \
                 --image-scanning-configuration scanOnPush=true \
                 --encryption-configuration encryptionType=AES256

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Push image to ECR
        env:
          IMAGE: ${{ needs.Build.outputs.image }}
        run: |
          docker load -i "$IMAGE_ARTIFACT"
          docker push "$IMAGE"
          echo "Pushed image: $IMAGE"

  Deploy:
    needs: [Build, Deliver]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ needs.Build.outputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Pre-check Helm release lock
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
        run: |
          set -euo pipefail

          if ! helm status "$HELM_RELEASE" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "No existing Helm release — fresh install"
            exit 0
          fi

          STATUS="$(helm status "$HELM_RELEASE" -n "$NAMESPACE" -o json | jq -r '.info.status // empty')"
          LAST_DEPLOYED_REV="$(helm history "$HELM_RELEASE" -n "$NAMESPACE" -o json | jq -r '[.[] | select(.status=="deployed")][-1].revision // empty')"

          echo "Helm release status: ${STATUS:-unknown}"
          echo "Last deployed revision: ${LAST_DEPLOYED_REV:-none}"

          cleanup_release() {
            echo "Uninstalling release $HELM_RELEASE from $NAMESPACE for clean install"
            helm uninstall "$HELM_RELEASE" -n "$NAMESPACE" --wait --timeout 5m || true
            for pending_status in pending-install pending-upgrade pending-rollback; do
              mapfile -t PENDING_SECRETS < <(kubectl get secrets -n "$NAMESPACE" -l "owner=helm,name=$HELM_RELEASE,status=$pending_status" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
              for secret in "${PENDING_SECRETS[@]:-}"; do
                if [[ -n "$secret" ]]; then
                  kubectl delete secret "$secret" -n "$NAMESPACE" || true
                fi
              done
            done
          }

          if [[ "$STATUS" =~ ^pending-(install|upgrade|rollback)$ ]]; then
            echo "Release is stuck in $STATUS"
            if [[ -n "$LAST_DEPLOYED_REV" ]]; then
              echo "Rolling back to last deployed revision: $LAST_DEPLOYED_REV"
              helm rollback "$HELM_RELEASE" "$LAST_DEPLOYED_REV" -n "$NAMESPACE" --timeout 5m || cleanup_release
            else
              cleanup_release
            fi
          elif [[ "$STATUS" == "failed" || -z "$LAST_DEPLOYED_REV" ]]; then
            echo "Release has no healthy deployed revision — cleaning up before install"
            cleanup_release
          fi

      - name: Deploy with Helm rolling update
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
          VALUES_FILE: ${{ needs.Build.outputs.values }}
          IMAGE_TAG: ${{ needs.Build.outputs.tag }}
          IMAGE_REPO: ${{ needs.Build.outputs.image_repo }}
          ENV_NAME: ${{ needs.Build.outputs.env_name }}
        run: |
          echo "Deploying $IMAGE_TAG to $ENV_NAME ($NAMESPACE)"

          # Do not use helm --wait: Ingress/ALB can hang. Wait on Deployment in Verify.
          if ! helm upgrade --install "$HELM_RELEASE" helm/e3-diagnostic-software \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values helm/e3-diagnostic-software/values.yaml \
            --values "$VALUES_FILE" \
            --set-string image.repository="$IMAGE_REPO" \
            --set-string image.tag="$IMAGE_TAG" \
            --set-string config.appVersion="$IMAGE_TAG" \
            --set-string podAnnotations.appVersion="$IMAGE_TAG" \
            --description "Deploy $IMAGE_TAG to $ENV_NAME" \
            --timeout 5m; then
            echo "Helm upgrade failed — retrying after cleanup"
            helm uninstall "$HELM_RELEASE" -n "$NAMESPACE" --wait --timeout 5m || true
            helm upgrade --install "$HELM_RELEASE" helm/e3-diagnostic-software \
              --namespace "$NAMESPACE" \
              --create-namespace \
              --values helm/e3-diagnostic-software/values.yaml \
              --values "$VALUES_FILE" \
              --set-string image.repository="$IMAGE_REPO" \
              --set-string image.tag="$IMAGE_TAG" \
              --set-string config.appVersion="$IMAGE_TAG" \
              --set-string podAnnotations.appVersion="$IMAGE_TAG" \
              --description "Deploy $IMAGE_TAG to $ENV_NAME (retry)" \
              --timeout 5m
          fi

  Verify:
    needs: [Build, Deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.Build.outputs.env_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Verify rollout
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
          IMAGE_TAG: ${{ needs.Build.outputs.tag }}
        run: |
          kubectl rollout status deployment/e3-diagnostic-software \
            --namespace "$NAMESPACE" \
            --timeout=10m

          echo "========================================"
          echo " Deployed image tag: $IMAGE_TAG"
          echo "========================================"
          kubectl get pods,service,ingress,hpa -o wide --namespace "$NAMESPACE" -l app=e3-diagnostic-software
          kubectl get deploy e3-diagnostic-software -n "$NAMESPACE" -o wide
          helm history "$HELM_RELEASE" --namespace "$NAMESPACE" --max 10

      - name: Show pod logs (startup detail)
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
        run: |
          set -euo pipefail
          POD="$(kubectl get pods -n "$NAMESPACE" -l app=e3-diagnostic-software \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -z "$POD" ]]; then
            POD="$(kubectl get pods -n "$NAMESPACE" -l app=e3-diagnostic-software \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          fi
          if [[ -z "$POD" ]]; then
            echo "No API pod found"
            kubectl get pods -n "$NAMESPACE" -l app=e3-diagnostic-software -o wide || true
            exit 1
          fi

          echo "=== pod: $POD ==="
          kubectl get pod "$POD" -n "$NAMESPACE" -o wide
          echo
          echo "=== describe (status / events) ==="
          kubectl describe pod "$POD" -n "$NAMESPACE" | sed -n '/^Containers:/,/^Conditions:/p;/^Events:/,$p'
          echo
          echo "=== current logs (tail 150) ==="
          kubectl logs "$POD" -n "$NAMESPACE" --tail=150 || true
          echo
          echo "=== previous container logs (if restarted) ==="
          kubectl logs "$POD" -n "$NAMESPACE" --previous --tail=100 2>/dev/null || echo "(no previous container)"

      - name: Verify /api/v1/health
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
        run: |
          HOST="$(kubectl get ingress -n "$NAMESPACE" -l app=e3-diagnostic-software \
            -o jsonpath='{.items[0].spec.rules[0].host}')"
          if [[ -z "$HOST" ]]; then
            echo "No ingress host found for app in namespace $NAMESPACE"
            exit 1
          fi

          URL="https://${HOST}/api/v1/health"
          echo "Checking $URL"
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors "$URL"
          echo

      - name: Collect diagnostics on failure
        if: failure()
        env:
          NAMESPACE: ${{ needs.Build.outputs.namespace }}
        run: |
          echo "=== Helm status ==="
          helm status "$HELM_RELEASE" -n "$NAMESPACE" || true
          helm history "$HELM_RELEASE" -n "$NAMESPACE" --max 5 || true
          echo "=== pods / events / deploy ==="
          kubectl get pods,events,deploy,ingress -n "$NAMESPACE" -l app=e3-diagnostic-software || true
          kubectl describe deployment e3-diagnostic-software -n "$NAMESPACE" || true
          for POD in $(kubectl get pods -n "$NAMESPACE" -l app=e3-diagnostic-software -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "=== describe $POD ==="
            kubectl describe pod "$POD" -n "$NAMESPACE" || true
            echo "=== logs $POD ==="
            kubectl logs "$POD" -n "$NAMESPACE" --tail=300 || true
            echo "=== previous logs $POD ==="
            kubectl logs "$POD" -n "$NAMESPACE" --previous --tail=200 2>/dev/null || true
          done
