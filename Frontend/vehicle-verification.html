<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b10">
    <title>E3 ELECTRIC.AI | Vehicle Verification</title>
    <script>
        const sessionEmployeeId = localStorage.getItem("e3EmployeeId");
        const sessionExpiresAt = Number(localStorage.getItem("e3SessionExpiresAt"));
        if (!sessionEmployeeId || !Number.isFinite(sessionExpiresAt) ||
            sessionExpiresAt <= Date.now()) {
            window.location.replace("/login");
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/Style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            height: auto;
            background: #080b10;
            color: #ffffff;
            font-family: "Google Sans", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-layout {
            width: 100%;
            max-width: 1480px;
            min-height: 710px;
            display: grid;
            grid-template-columns: minmax(360px, 0.88fr) minmax(650px, 1.12fr);
            background: #111720;
            border: 1px solid #26313d;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
        }

        .vehicle-panel {
            position: relative;
            min-height: 710px;
            overflow: hidden;
            isolation: isolate;
            background: #040507;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 42px;
            border-right: 1px solid #27313c;
        }

        .vehicle-panel::before {
            content: "";
            position: absolute;
            top: 78px;
            left: 16px;
            right: 16px;
            bottom: 168px;
            background-image: url("/static/TRiON C1x Red Halo Studio Render.png");
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        .vehicle-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(4, 5, 7, 0.46) 0%,
                transparent 18%,
                transparent 70%,
                rgba(4, 5, 7, 0.86) 100%
            );
            pointer-events: none;
            z-index: 0;
        }

        .brand {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: 65px;
        }

        .brand-logo {
            display: block;
            width: 100%;
            max-width: 320px;
            max-height: 70px;
            height: auto;
            object-fit: contain;
            object-position: left center;
            transform: translateY(-10px);
        }

        .vehicle-caption {
            position: relative;
            z-index: 2;
            max-width: 500px;
        }

        .vehicle-caption h1 {
            font-size: clamp(32px, 3.5vw, 44px);
            line-height: 1.13;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: #f5f7fa;
            margin-bottom: 16px;
            max-width: 480px;
        }

        .vehicle-caption p {
            color: #a6b1bd;
            font-size: 14px;
            line-height: 1.8;
            max-width: 430px;
            letter-spacing: 0.1px;
        }

        .verification-panel {
            min-width: 0;
            display: flex;
            align-items: center;
            padding: 30px 34px;
            background: #101720;
        }

        .verification-content {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .vehicle-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            color: #d5dce5;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            height: 42px;
            border: 1px solid #303d4b;
            border-radius: 7px;
            background: #171f29;
            color: #f5f7fa;
            padding: 0 11px;
            font-size: 13px;
            font-family: inherit;
        }

        .field input:focus,
        .field select:focus {
            outline: 2px solid #e34844;
            outline-offset: -1px;
        }

        #vehicle-submit {
            min-width: 120px;
        }

        @media (max-width: 1050px) {
            .login-layout {
                grid-template-columns: minmax(300px, 0.8fr) minmax(560px, 1.2fr);
            }

            .vehicle-panel {
                padding: 30px;
            }

            .verification-panel {
                padding: 24px;
            }
        }

        @media (max-width: 820px) {
            body {
                padding: 14px;
                align-items: flex-start;
            }

            .login-layout {
                grid-template-columns: 1fr;
            }

            .vehicle-panel {
                min-height: 390px;
                padding: 27px;
                border-right: none;
                border-bottom: 1px solid #27313c;
            }

            .vehicle-panel::before {
                bottom: 110px;
            }

            .vehicle-caption h1 {
                font-size: 32px;
            }

            .verification-panel {
                padding: 28px 22px;
            }
        }

        @media (max-width: 560px) {
            .vehicle-form-grid {
                grid-template-columns: 1fr;
            }

            .vehicle-panel {
                min-height: 350px;
            }

            .vehicle-caption h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <main class="login-layout">
        <section class="vehicle-panel">
            <div class="brand">
                <img
                    src="/static/e3-electric-ai-logo.png"
                    alt="E3 ELECTRIC.AI"
                    class="brand-logo"
                >
            </div>
            <div class="vehicle-caption">
                <h1>Intelligence Behind Every Journey.</h1>
                <p>
                    Advanced EV telemetry, real-time CAN monitoring,
                    and intelligent vehicle diagnostics — all in one platform.
                </p>
            </div>
        </section>

        <section class="verification-panel">
            <form id="vehicle-details-form" class="verification-content" aria-label="Vehicle details">
                <div class="vehicle-form-grid">
                    <div class="field">
                        <label for="firmware-vin">VIN</label>
                        <input id="firmware-vin" name="vin" type="text" value="ME9AC1011BJ693015" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="firmware-registration">Registration</label>
                        <input id="firmware-registration" name="registration" type="text" value="KA38X7172" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="firmware-mobile">Mobile Number</label>
                        <input id="firmware-mobile" name="mobile" type="tel" value="+91 9113627818" autocomplete="tel" required>
                    </div>
                    <div class="field">
                        <label for="firmware-variant">Variant</label>
                        <select id="firmware-variant" name="variant" required>
                            <option value="C1">C1</option>
                            <option value="C1x">C1x</option>
                            <option value="C2">C2</option>
                        </select>
                    </div>
                </div>
                <button id="vehicle-submit" class="btn primary" type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script type="module" src="/static/vehicle-verification.js"></script>
</body>
</html>
