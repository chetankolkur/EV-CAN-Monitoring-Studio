replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 30m
    memory: 96Mi
  limits:
    cpu: "200m"
    memory: 192Mi

existingEnvSecret: ""

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: e3-dev
    alb.ingress.kubernetes.io/group.order: "90"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:222634361936:certificate/21aa0ac9-7c87-4903-b7a1-827416696a14
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: e3-diagnostic-software-dev.e3techworld.com
      paths:
        - path: /
          pathType: Prefix
